<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Monthsary</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="uiOverlay">
            <div id="countersContainer">
                <div id="collectionCounter">Envelopes: <span id="letterCount">0</span> / 8</div>
                <div id="picCounter" class="hidden">Pictures: <span id="picCount">0</span> / 6</div>
            </div>
            
            <div id="cassetteContainer">
                <img src="tape.png" id="cassetteIcon" alt="Cassette Player">
                <div id="cassettePlayMe" class="play-me-mini">PLAY ME</div>
            </div>
            
            <div id="backpackContainer">
                <div id="backpackIcon">🎒</div>
                <div class="backpack-text">BAG</div>
            </div>
        </div>

        <!-- Big Cassette UI Popup -->
        <div id="bigCassettePopup" class="hidden fade-transition">
            <div class="cassette-ui-wrapper">
                <div class="cassette-machine-sprite">
                    <button id="closeCassetteBtn" class="pixel-close-btn">X</button>
                    <div id="cassetteTray" class="closed"></div>
                    <img src="tape.png" id="insertedTape" class="hidden">
                </div>
                
                <div class="play-me-text">PLAY ME</div>
                
                <div class="tapes-below">
                    <div class="tape-wrapper" data-track="1">
                        <img src="tape.png" class="tape-pick">
                        <span class="tape-label">Tape 1</span>
                    </div>
                    <div class="tape-wrapper" data-track="2">
                        <img src="tape.png" class="tape-pick">
                        <span class="tape-label">Tape 2</span>
                    </div>
                    <div class="tape-wrapper" data-track="3">
                        <img src="tape.png" class="tape-pick">
                        <span class="tape-label">Tape 3</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Popup for reading letter -->
        <div id="letterPopup" class="hidden fade-transition">
            <div class="paper-container">
                <div id="letterContent"></div>
            </div>
            <button id="closeLetterBtn" class="pixel-btn">Close</button>
        </div>

        <!-- Popup for displaying collected picture -->
        <div id="picPopup" class="hidden fade-transition">
            <div class="pic-container">
                <img id="picDisplay" src="pic1.png">
                <div id="picMessage" class="pic-message">Cuties together</div>
            </div>
            <button id="closePicBtn" class="pixel-btn">Collect!</button>
        </div>

        <!-- Backpack UI Popup -->
        <div id="backpackPopup" class="hidden fade-transition">
            <div class="backpack-ui-wrapper">
                <button id="closeBackpackBtn" class="pixel-close-btn">X</button>
                <div class="backpack-tabs">
                    <button id="tabEnvelopes" class="pixel-tab active">Envelopes</button>
                    <button id="tabPics" class="pixel-tab">Pictures</button>
                </div>
                <div id="backpackGridEnvelopes" class="backpack-grid"></div>
                <div id="backpackGridPics" class="backpack-grid hidden"></div>
            </div>
        </div>

        <!-- Celebration Screen -->
        <div id="celebrationScreen" class="hidden fade-transition">
            <h1 class="celebration-title">Happy Monthsary Mahal ❤️</h1>
            <button id="playAgainBtn" class="pixel-btn">Play Again</button>
        </div>

        <!-- Always Visible Joystick & Jump -->
        <div id="mobileControls">
            <div id="joystickBase">
                <div id="joystickStick"></div>
            </div>
            <div class="jump-container">
                <button id="jumpBtn">JUMP</button>
                <div id="jumpCooldownBar">
                    <div id="jumpCooldownFill"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Intro Screen -->
    <div id="introScreen" class="fullscreen-overlay fade-transition">
        <h1 class="pixel-title">Bunbun's Adventure</h1>
        <button id="startBtn" class="pixel-btn">START GAME</button>
    </div>

    <!-- Landscape Orientation Warning Overlay -->
    <div id="orientationOverlay" class="fullscreen-overlay hidden">
        <button id="closeRotateBtn" class="pixel-close-btn" style="position:absolute; top:20px; right:20px; z-index:100;">X</button>
        <div class="orientation-box">
            <div class="phone-icon">📱</div>
            <p>PLEASE ROTATE YOUR DEVICE TO LANDSCAPE TO PLAY!</p>
        </div>
    </div>

    <!-- Audio elements -->
    <audio id="music1" src="music1.mp3"></audio>
    <audio id="music2" src="music2.mp3"></audio>
    <audio id="music3" src="music3.mp3"></audio>
    <audio id="sfxWalk" src="walk.mp3" loop></audio>
    <audio id="sfxJump" src="jump.mp3"></audio>
    <audio id="sfxBatHit" src="bat_hit.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
